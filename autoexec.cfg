//=========================================================
// L4D2 SIMPLE AUTOEXEC + NEON GLOWS
// BY: EITO
//
// Configuración sencilla para copiar y pegar.
// Incluye únicamente movimiento, FOV/viewmodel,
// red, LERP, mensaje de equipo y tus Glows.
//=========================================================

//-------------------------
// NULL MOVEMENT
//-------------------------

bind "w" "+mfwd"
bind "s" "+mback"
bind "a" "+mleft"
bind "d" "+mright"

alias "+mfwd" "-back; +forward; alias checkfwd +forward"
alias "+mback" "-forward; +back; alias checkback +back"
alias "+mleft" "-moveright; +moveleft; alias checkleft +moveleft"
alias "+mright" "-moveleft; +moveright; alias checkright +moveright"

alias "-mfwd" "-forward; checkback; alias checkfwd none"
alias "-mback" "-back; checkfwd; alias checkback none"
alias "-mleft" "-moveleft; checkright; alias checkleft none"
alias "-mright" "-moveright; checkleft; alias checkright none"

alias "checkfwd" "none"
alias "checkback" "none"
alias "checkleft" "none"
alias "checkright" "none"
alias "none" ""

//-------------------------
// CONSOLA
//-------------------------
bind "F8" "toggle console"

//-------------------------
// VIEWMODEL / FOV
//-------------------------

bind "." "toggle cl_viewmodelfovsurvivor 60 100 130 180"
bind "," "toggle fov_desired 90 95 100 110 120"

//-------------------------
// RED
//-------------------------

rate 100000
cl_cmdrate 100
cl_updaterate 100
cl_lagcompensation 1

//-------------------------
// LERP
//-------------------------

cl_interp 0.0
cl_interp_ratio 0

//-------------------------
// MENSAJE DE EQUIPO
//-------------------------

bind "b" "say_team BACK BACK BACK BACK BACK BACK"

//-------------------------
// FIN DE CONFIGURACIÓN BÁSICA
//-------------------------

//          L4D2 COMPETITIVE NEON GLOW PACK V2
//                 PARTE 1 - COLORES BASE
//=========================================================
//=========================================================
//
// COLORES INTENSOS:
//
// VERDE       = VIDA ALTA / INFECTADO ACTIVO
// AMARILLO    = VIDA MEDIA
// ROJO       = VIDA BAJA / PELIGRO
// AZUL       = INFECTADO FANTASMA
// ROSA       = WITCH
// BLANCO      = ESTADO INCAPACITADO
//
// LOS VALORES DE COLOR UTILIZAN 0.0 - 1.0
//
//=========================================================


//=========================================================
//                  SUPERVIVIENTES
//=========================================================

//---------------------------------------------------------
// COMPAÑEROS SUPERVIVIENTES
// VERDE INTENSO
//---------------------------------------------------------

cl_glow_survivor_r "0.0"
cl_glow_survivor_g "1.0"
cl_glow_survivor_b "0.0"

cl_glow_survivor_colorblind_r "0.0"
cl_glow_survivor_colorblind_g "1.0"
cl_glow_survivor_colorblind_b "0.0"


//=========================================================
//              SALUD DE SUPERVIVIENTES
//          VISTA DESDE EL EQUIPO INFECTADO
//=========================================================


//---------------------------------------------------------
// VIDA ALTA
// VERDE INTENSO
//---------------------------------------------------------

cl_glow_survivor_health_high_r "0.0"
cl_glow_survivor_health_high_g "1.0"
cl_glow_survivor_health_high_b "0.0"

cl_glow_survivor_health_high_colorblind_r "0.0"
cl_glow_survivor_health_high_colorblind_g "1.0"
cl_glow_survivor_health_high_colorblind_b "0.0"


//---------------------------------------------------------
// VIDA MEDIA
// AMARILLO INTENSO
//---------------------------------------------------------

cl_glow_survivor_health_med_r "1.0"
cl_glow_survivor_health_med_g "1.0"
cl_glow_survivor_health_med_b "0.0"

cl_glow_survivor_health_med_colorblind_r "1.0"
cl_glow_survivor_health_med_colorblind_g "1.0"
cl_glow_survivor_health_med_colorblind_b "0.0"


//---------------------------------------------------------
// VIDA BAJA
// ROJO INTENSO
//---------------------------------------------------------

cl_glow_survivor_health_low_r "1.0"
cl_glow_survivor_health_low_g "0.0"
cl_glow_survivor_health_low_b "0.0"

cl_glow_survivor_health_low_colorblind_r "1.0"
cl_glow_survivor_health_low_colorblind_g "0.0"
cl_glow_survivor_health_low_colorblind_b "0.0"


//---------------------------------------------------------
// VIDA CRÍTICA
// ROJO INTENSO
//
// En la Parte 2 será:
// ROJO <-> AMARILLO
// PARPADEO LENTO
//---------------------------------------------------------

cl_glow_survivor_health_crit_r "1.0"
cl_glow_survivor_health_crit_g "0.0"
cl_glow_survivor_health_crit_b "0.0"

cl_glow_survivor_health_crit_colorblind_r "1.0"
cl_glow_survivor_health_crit_colorblind_g "0.0"
cl_glow_survivor_health_crit_colorblind_b "0.0"


//=========================================================
//               SUPERVIVIENTE INCAPACITADO
//=========================================================
//
// ROJO INTENSO
//
// En la Parte 2 será:
// ROJO <-> BLANCO
// PARPADEO MUY RÁPIDO
//=========================================================

cl_glow_survivor_hurt_r "1.0"
cl_glow_survivor_hurt_g "0.0"
cl_glow_survivor_hurt_b "0.0"


//=========================================================
//                 SUPERVIVIENTE AGARRADO
//=========================================================
//
// Hunter
// Smoker
// Charger
// Jockey
//
// ROJO INTENSO
//
// En la Parte 2 será:
// ROJO <-> AMARILLO
// PARPADEO EXTREMADAMENTE RÁPIDO
//=========================================================

cl_glow_ability_r "1.0"
cl_glow_ability_g "0.0"
cl_glow_ability_b "0.0"

cl_glow_ability_colorblind_r "1.0"
cl_glow_ability_colorblind_g "0.0"
cl_glow_ability_colorblind_b "0.0"


//=========================================================
//                  INFECTADOS ALIADOS
//=========================================================


//---------------------------------------------------------
// INFECTADO EN MODO FANTASMA
// AZUL INTENSO
//---------------------------------------------------------

cl_glow_ghost_infected_r "0.0"
cl_glow_ghost_infected_g "0.25"
cl_glow_ghost_infected_b "1.0"


//---------------------------------------------------------
// INFECTADO ACTIVO
// ROJO INTENSO
//---------------------------------------------------------

cl_glow_infected_r "1.0"
cl_glow_infected_g "0.25"
cl_glow_infected_b "0.0"


//---------------------------------------------------------
// INFECTADO CUBIERTO DE BILIS
// MORADO INTENSO
//---------------------------------------------------------

cl_glow_infected_vomit_r "1.0"
cl_glow_infected_vomit_g "0.0"
cl_glow_infected_vomit_b "1.0"


//=========================================================
//              SUPERVIVIENTE CUBIERTO DE BILIS
//=========================================================

cl_glow_survivor_vomit_r "1.0"
cl_glow_survivor_vomit_g "0.0"
cl_glow_survivor_vomit_b "1.0"


//=========================================================
//                         WITCH
//=========================================================


//---------------------------------------------------------
// WITCH TRANQUILA
// ROSA INTENSO
//---------------------------------------------------------

cl_witch_glow_idle_r "1.0"
cl_witch_glow_idle_g "0.0"
cl_witch_glow_idle_b "0.70"


//---------------------------------------------------------
// WITCH ENOJADA
// ROJO INTENSO
//---------------------------------------------------------

cl_witch_glow_angry_r "1.0"
cl_witch_glow_angry_g "0.0"
cl_witch_glow_angry_b "0.0"


//=========================================================
//                         OBJETOS
//=========================================================
//
// Los objetos tendrán su propio efecto multicolor
// en la Parte 3.
//
// Aquí solamente establecemos el color inicial.
//=========================================================


//---------------------------------------------------------
// OBJETOS CERCANOS
// BLANCO INTENSO
//---------------------------------------------------------

cl_glow_item_r "1.0"
cl_glow_item_g "1.0"
cl_glow_item_b "1.0"


//---------------------------------------------------------
// OBJETOS LEJANOS
// BLANCO INTENSO
//---------------------------------------------------------

cl_glow_item_far_r "1.0"
cl_glow_item_far_g "1.0"
cl_glow_item_far_b "1.0"


//---------------------------------------------------------
// OBJETOS DURANTE BLANCO Y NEGRO
// BLANCO
//---------------------------------------------------------

cl_glow_thirdstrike_item_r "1.0"
cl_glow_thirdstrike_item_g "1.0"
cl_glow_thirdstrike_item_b "1.0"

cl_glow_thirdstrike_item_colorblind_r "1.0"
cl_glow_thirdstrike_item_colorblind_g "1.0"
cl_glow_thirdstrike_item_colorblind_b "1.0"


//=========================================================
//                 PULSO DE DESANGRADO
//=========================================================

cl_glow_survivor_health_bleed_pulse "1"
cl_glow_survivor_health_bleed_pulse_amount "1"
cl_glow_survivor_health_bleed_pulse_speed "30"

cl_glow_survivor_health_include_buffer "1"


//=========================================================
//                  FIN DE PARTE 1
//=========================================================

//=========================================================
//=========================================================
//          L4D2 COMPETITIVE NEON GLOW PACK V2
//                 PARTE 2 - PARPADEOS
//=========================================================
//=========================================================
//
// CRÍTICO:
// ROJO <-> AMARILLO
// VELOCIDAD LENTA
//
// INCAPACITADO:
// ROJO <-> BLANCO
// VELOCIDAD MUY RÁPIDA
//
// AGARRADO:
// ROJO <-> AMARILLO
// VELOCIDAD EXTREMADAMENTE RÁPIDA
//
// TODOS LOS COLORES SON INTENSOS.
//
//=========================================================


//=========================================================
// 1. SUPERVIVIENTE EN ESTADO CRÍTICO
//=========================================================
//
// ROJO INTENSO
//        ↓
// AMARILLO INTENSO
//        ↓
// ROJO INTENSO
//
// wait 25 = lento
//=========================================================

alias "GlowCriticoRojo" "cl_glow_survivor_health_crit_r 1.0;cl_glow_survivor_health_crit_g 0.0;cl_glow_survivor_health_crit_b 0.0;wait 25;GlowCriticoAmarillo"

alias "GlowCriticoAmarillo" "cl_glow_survivor_health_crit_r 1.0;cl_glow_survivor_health_crit_g 1.0;cl_glow_survivor_health_crit_b 0.0;wait 25;GlowCriticoRojo"

GlowCriticoRojo



//=========================================================
// 2. SUPERVIVIENTE INCAPACITADO
//=========================================================
//
// ROJO INTENSO
//        ↓
// BLANCO INTENSO
//        ↓
// ROJO INTENSO
//
// wait 3 = muy rápido
//
// Este es más rápido que el estado crítico.
//=========================================================

alias "GlowIncapRojo" "cl_glow_survivor_hurt_r 1.0;cl_glow_survivor_hurt_g 0.0;cl_glow_survivor_hurt_b 0.0;wait 3;GlowIncapBlanco"

alias "GlowIncapBlanco" "cl_glow_survivor_hurt_r 1.0;cl_glow_survivor_hurt_g 1.0;cl_glow_survivor_hurt_b 1.0;wait 3;GlowIncapRojo"

GlowIncapRojo



//=========================================================
// 3. SUPERVIVIENTE AGARRADO POR SPECIAL INFECTED
//=========================================================
//
// Hunter
// Smoker
// Charger
// Jockey
//
// ROJO INTENSO
//        ↓
// AMARILLO INTENSO
//        ↓
// ROJO INTENSO
//
// wait 2 = extremadamente rápido
//
// Mantenemos la velocidad que ya probaste y te gustó.
// Solamente hacemos el rojo mucho más intenso.
//=========================================================

alias "GlowAgarradoRojo" "cl_glow_ability_r 1.0;cl_glow_ability_g 0.0;cl_glow_ability_b 0.0;wait 2;GlowAgarradoAmarillo"

alias "GlowAgarradoAmarillo" "cl_glow_ability_r 1.0;cl_glow_ability_g 1.0;cl_glow_ability_b 0.0;wait 2;GlowAgarradoRojo"

GlowAgarradoRojo



//=========================================================
// 4. COLORBLIND - SUPERVIVIENTE AGARRADO
//=========================================================
//
// Mantenemos exactamente el mismo patrón de colores.
//=========================================================

alias "GlowAgarradoCBRojo" "cl_glow_ability_colorblind_r 1.0;cl_glow_ability_colorblind_g 0.0;cl_glow_ability_colorblind_b 0.0;wait 2;GlowAgarradoCBAmarillo"

alias "GlowAgarradoCBAmarillo" "cl_glow_ability_colorblind_r 1.0;cl_glow_ability_colorblind_g 1.0;cl_glow_ability_colorblind_b 0.0;wait 2;GlowAgarradoCBRojo"

GlowAgarradoCBRojo



//=========================================================
//                 FIN DE PARTE 2
//=========================================================

//=========================================================
//=========================================================
//          L4D2 COMPETITIVE NEON GLOW PACK V2
//              PARTE 3 - ARMAS Y OBJETOS
//=========================================================
//=========================================================
//
// OBJETOS CERCANOS:
// CICLO MULTICOLOR
//
// BLANCO → AZUL → MORADO → ROSA → ROJO →
// AMARILLO → VERDE → BLANCO
//
// VELOCIDAD MEDIA
//
// LOS OBJETOS NO SE APAGAN ENTRE COLORES.
//
//=========================================================


//=========================================================
//             OBJETOS CERCANOS - BLANCO
//=========================================================
//
// COLOR:
// BLANCO INTENSO
//
// wait 12 = velocidad media
//=========================================================

alias "GlowItemBlanco" "cl_glow_item_r 1.0;cl_glow_item_g 1.0;cl_glow_item_b 1.0;wait 12;GlowItemAzul"


//=========================================================
//             OBJETOS CERCANOS - AZUL
//=========================================================

alias "GlowItemAzul" "cl_glow_item_r 0.0;cl_glow_item_g 0.25;cl_glow_item_b 1.0;wait 12;GlowItemMorado"


//=========================================================
//             OBJETOS CERCANOS - MORADO
//=========================================================

alias "GlowItemMorado" "cl_glow_item_r 1.0;cl_glow_item_g 0.0;cl_glow_item_b 1.0;wait 12;GlowItemRosa"


//=========================================================
//             OBJETOS CERCANOS - ROSA
//=========================================================

alias "GlowItemRosa" "cl_glow_item_r 1.0;cl_glow_item_g 0.0;cl_glow_item_b 0.70;wait 12;GlowItemRojo"


//=========================================================
//             OBJETOS CERCANOS - ROJO
//=========================================================

alias "GlowItemRojo" "cl_glow_item_r 1.0;cl_glow_item_g 0.0;cl_glow_item_b 0.0;wait 12;GlowItemAmarillo"


//=========================================================
//             OBJETOS CERCANOS - AMARILLO
//=========================================================

alias "GlowItemAmarillo" "cl_glow_item_r 1.0;cl_glow_item_g 1.0;cl_glow_item_b 0.0;wait 12;GlowItemVerde"


//=========================================================
//             OBJETOS CERCANOS - VERDE
//=========================================================

alias "GlowItemVerde" "cl_glow_item_r 0.0;cl_glow_item_g 1.0;cl_glow_item_b 0.0;wait 12;GlowItemBlanco"


//=========================================================
//                 INICIAR CICLO
//=========================================================

GlowItemBlanco



//=========================================================
//              OBJETOS LEJANOS
//=========================================================
//
// Mismo ciclo multicolor.
//
// Esto evita que las armas/objetos lejanos desaparezcan
// completamente durante el cambio de color.
//
//=========================================================


//---------------------------------------------------------
// BLANCO
//---------------------------------------------------------

alias "GlowItemFarBlanco" "cl_glow_item_far_r 1.0;cl_glow_item_far_g 1.0;cl_glow_item_far_b 1.0;wait 12;GlowItemFarAzul"


//---------------------------------------------------------
// AZUL
//---------------------------------------------------------

alias "GlowItemFarAzul" "cl_glow_item_far_r 0.0;cl_glow_item_far_g 0.25;cl_glow_item_far_b 1.0;wait 12;GlowItemFarMorado"


//---------------------------------------------------------
// MORADO
//---------------------------------------------------------

alias "GlowItemFarMorado" "cl_glow_item_far_r 1.0;cl_glow_item_far_g 0.0;cl_glow_item_far_b 1.0;wait 12;GlowItemFarRosa"


//---------------------------------------------------------
// ROSA
//---------------------------------------------------------

alias "GlowItemFarRosa" "cl_glow_item_far_r 1.0;cl_glow_item_far_g 0.0;cl_glow_item_far_b 0.70;wait 12;GlowItemFarRojo"


//---------------------------------------------------------
// ROJO
//---------------------------------------------------------

alias "GlowItemFarRojo" "cl_glow_item_far_r 1.0;cl_glow_item_far_g 0.0;cl_glow_item_far_b 0.0;wait 12;GlowItemFarAmarillo"


//---------------------------------------------------------
// AMARILLO
//---------------------------------------------------------

alias "GlowItemFarAmarillo" "cl_glow_item_far_r 1.0;cl_glow_item_far_g 1.0;cl_glow_item_far_b 0.0;wait 12;GlowItemFarVerde"


//---------------------------------------------------------
// VERDE
//---------------------------------------------------------

alias "GlowItemFarVerde" "cl_glow_item_far_r 0.0;cl_glow_item_far_g 1.0;cl_glow_item_far_b 0.0;wait 12;GlowItemFarBlanco"


//=========================================================
//                 INICIAR CICLO LEJANO
//=========================================================

GlowItemFarBlanco



//=========================================================
//          OBJETOS EN BLANCO Y NEGRO
//=========================================================
//
// En blanco y negro mantenemos un color claro para que
// los objetos sigan siendo fáciles de localizar.
//
// BLANCO → ROJO → BLANCO
//
// Velocidad lenta.
//=========================================================

alias "GlowThirdStrikeBlanco" "cl_glow_thirdstrike_item_r 1.0;cl_glow_thirdstrike_item_g 1.0;cl_glow_thirdstrike_item_b 1.0;wait 30;GlowThirdStrikeRojo"

alias "GlowThirdStrikeRojo" "cl_glow_thirdstrike_item_r 1.0;cl_glow_thirdstrike_item_g 0.0;cl_glow_thirdstrike_item_b 0.0;wait 30;GlowThirdStrikeBlanco"

GlowThirdStrikeBlanco



//=========================================================
//                 FIN DE PARTE 3
//=========================================================

//=========================================================
//=========================================================
//          L4D2 COMPETITIVE NEON GLOW PACK V2
//              PARTE 4 - AJUSTES FINALES
//=========================================================
//=========================================================
//
// AJUSTES PARA:
// - BLANCO Y NEGRO
// - INCAPACITADOS
// - VISIBILIDAD DE GLOWS
// - VIDA TEMPORAL
//
//=========================================================


//=========================================================
//          OBJETOS EN ESTADO BLANCO Y NEGRO
//=========================================================
//
// Cuando estás en blanco y negro, los objetos mantienen
// un pulso rojo/blanco lento.
//
// Esto NO cambia el glow del superviviente.
// Es únicamente para los objetos asociados a
// third strike.
//=========================================================

cl_glow_thirdstrike_item_colorblind_r "1.0"
cl_glow_thirdstrike_item_colorblind_g "1.0"
cl_glow_thirdstrike_item_colorblind_b "1.0"


//=========================================================
//             PULSO DE SUPERVIVIENTE INCAPACITADO
//=========================================================
//
// Permite que el propio sistema de glow de L4D2 haga
// el pulso relacionado con la pérdida de vida mientras
// el superviviente está incapacitado.
//=========================================================

cl_glow_survivor_health_bleed_pulse "1"

cl_glow_survivor_health_bleed_pulse_amount "1"

cl_glow_survivor_health_bleed_pulse_speed "30"


//=========================================================
//             VIDA TEMPORAL / BUFFER
//=========================================================
//
// Hace que la vida temporal también pueda ser tomada
// en cuenta por el sistema de glow de salud.
//=========================================================

cl_glow_survivor_health_include_buffer "1"


//=========================================================
//             COLORES COLORBLIND DE SALUD
//=========================================================
//
// Mantenemos exactamente la misma paleta intensa.
//
// VERDE  = VIDA ALTA
// AMARILLO = VIDA MEDIA
// ROJO   = VIDA BAJA
// ROJO   = CRÍTICO
//=========================================================

//=========================================================
//          COLORBLIND DEL SUPERVIVIENTE AGARRADO
//=========================================================
//
// ROJO <-> AMARILLO
// La animación principal está en la Parte 2.
//=========================================================

cl_glow_ability_colorblind_r "1.0"
cl_glow_ability_colorblind_g "0.0"
cl_glow_ability_colorblind_b "0.0"

//=========================================================
//                  FIN DE PARTE 4
//=========================================================


//=============================================
// FIN DEL AUTOEXEC
//=============================================

echo "Competitive Pack cargado."
// host_writeconfig
