alias "GlowAgarradoRojo" "cl_glow_ability_r 1.0;cl_glow_ability_g 0.0;cl_glow_ability_b 0.0;wait 2;GlowAgarradoAmarillo"
alias "GlowAgarradoAmarillo" "cl_glow_ability_r 1.0;cl_glow_ability_g 1.0;cl_glow_ability_b 0.0;wait 2;GlowAgarradoRojo"
