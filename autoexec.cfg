GlowCriticoRojo

alias "GlowIncapRojo" "cl_glow_survivor_hurt_r 1.0;cl_glow_survivor_hurt_g 0.0;cl_glow_survivor_hurt_b 0.0;wait 3;GlowIncapBlanco"
alias "GlowIncapBlanco" "cl_glow_survivor_hurt_r 1.0;cl_glow_survivor_hurt_g 1.0;cl_glow_survivor_hurt_b 1.0;wait 3;GlowIncapRojo"
