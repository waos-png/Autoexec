//=========================================================

// hud_fastswitch 1   -- no existe en este build de L4D2
// cl_autowepswitch 0   -- no existe en este build de L4D2
// developer 0   -- no existe/esta oculto en este build de L4D2
net_graph 3                      // monitor de FPS/ping en pantalla

//=========================================================
//     CLARIDAD VISUAL Y AUDIO
//=========================================================

mat_dynamic_tonemapping 0     // exposicion constante -- OJO: es cheat-protegido, solo aplica offline o con sv_cheats 1
snd_mixahead 0.05                // reduce ligeramente la latencia de audio (pasos, tank, etc.)

