//=========================================================
// L4D2 - RENDIMIENTO PARA GPU INTEGRADA
// Uso opcional: solo si NO tienes GPU dedicada
// (Intel Iris Xe, Intel UHD, AMD Vega integrada, etc.)
//
// Si tienes una GPU dedicada (GTX/RTX/RX), no ejecutes
// este archivo: vas a perder calidad visual (sombras,
// luces dinamicas) sin ninguna ganancia real de FPS.
//
// Cargalo con: exec autoexec_rendimiento_gpu_integrada.cfg
// o agregalo al final de tu autoexec.cfg
//=========================================================

mat_queue_mode 2              // renderizado multicore, aprovecha varios hilos de CPU
r_shadows 0                    // apaga sombras dinamicas, gran ganancia de FPS
r_dynamic 0                     // apaga luces dinamicas (linternas, fogonazos ajenos)
mat_specular 0                  // quita brillos especulares, menos carga de shaders
mat_reducefillrate 1          // reduce carga de relleno en efectos/particulas
cl_ejectbrass 0                 // menos particulas de casquillos
cl_forcepreload 1               // precarga modelos/texturas, evita tirones al aparecer hordes
fps_max 0                        // sin limite (cambia a un numero fijo, ej. 144, si prefieres estabilidad)

echo "Rendimiento GPU integrada aplicado."
